# Example global.ini for Indigo (Swiss).
# Copy it to /swiss/settings/global.ini on the device that holds your settings
# and change what you need. Every key is listed in docs/SETTINGS.md.
# One setting per line as Key=Value; keys and values are case-sensitive, and a
# key you leave out keeps its default. Indigo keeps these comments when it
# saves settings on the console; upstream Swiss does not.

# Where an In-Game Reset (A + Z + Start) takes you.
IGRType=Reboot
# Switch back on the cheats you enabled for a game last time.
AutoCheats=Yes
# Library layouts: 3D Boxes (default), Vertical, Grid, Spotlight or Jewel Case.
Library Layout=Grid
# Menu music off, navigation sounds on.
Disable Menu Music=Yes
Disable Menu SFX=No
# Keep a recent list without reopening the last game at boot.
RecentListLevel=Lazy
# SD speed: 32MHz is shown as 27 MHz on the console. Use 16MHz if a card is unreliable.
SD/IDE Speed=32MHz
# Every game starts with these unless its own file says otherwise.
Force Polling Rate=VSync
Force Widescreen=No
