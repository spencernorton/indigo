# A pushed tag becomes a GitHub Release: vX.Y.Z on main is a release (marked
# Latest), vX.Y.Z-beta.N and vX.Y.Z-rc.N on beta are pre-releases. The zip is built from the
# tagged commit on our own build runner (the pinned toolchain image), checked
# like every CI build, carries a build provenance attestation, and its notes
# are the tag's CHANGELOG section. workflow_dispatch builds an existing tag
# without publishing anything, to check the pipeline.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build as a dry run (nothing is published)
        required: true
      verify_feed:
        description: Also verify an already published tag against the deployed console feed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TOOLCHAIN: ghcr.io/extremscorner/libogc2@sha256:7c91503254afcf0acebc8edb6f81fc8535860c42ae31ca33dd1573464eb12565

jobs:
  build:
    name: Build the release zip
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Toolchain
        run: buildtools/ci/toolchain.sh "$TOOLCHAIN"
      - name: Check the tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            channel=main prerelease=false
          elif printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)\.[0-9]+'; then
            channel=beta prerelease=true
          else
            echo "not a release tag: $TAG (vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-rc.N)" >&2; exit 1
          fi
          # A release tag names a commit its branch already carries.
          git merge-base --is-ancestor HEAD "origin/$channel" || {
            echo "$TAG is not on $channel" >&2; exit 1; }
          title="Indigo $TAG"
          if [ "$prerelease" = false ]; then
            heading=$(awk -v v="$TAG" '/^## / && $2 == v { sub(/^## /, ""); print; exit }' CHANGELOG.md)
            [ -n "$heading" ] || { echo "CHANGELOG.md has no '## $TAG' section" >&2; exit 1; }
            title="Indigo $heading"
          fi
          {
            echo "tag=$TAG"
            echo "sha=$(git rev-parse HEAD)"
            echo "title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # The checked-out tag may predate the feature and this helper.
      # Report recorded card coverage without blocking an untested card.
      - name: Report MemCard PRO test coverage
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -f cube/swiss/source/gui/card_slots.c ]; then
            python3 buildtools/ci/check_memcard_qualification.py "$TAG" --report >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build Indigo
        run: make -j8 dev
      - name: Check the DOL
        run: |
          mkdir -p dist
          if [ -f buildtools/ci/check_unwind.sh ]; then
            buildtools/ci/check_unwind.sh cube/swiss/swiss.elf
          fi
          if [ -f buildtools/ci/check_stack_usage.py ]; then
            python3 buildtools/ci/check_stack_usage.py cube/swiss
          fi
          python3 buildtools/ci/verify_dol.py cube/swiss/swiss.dol --toolchain "$TOOLCHAIN" \
            --revision "$(git rev-parse HEAD)" --short "$(git rev-parse HEAD | cut -c1-7)" \
            --out dist/provenance.json
          if grep -qF "$PWD" cube/swiss/swiss.dol; then
            echo "::error::The DOL names the folder it was built in ($PWD): a build elsewhere would differ."
            exit 1
          fi
          if [ -f buildtools/ui/tests/test_boot_image.py ] && grep -q -- '--check-files' buildtools/ui/tests/test_boot_image.py; then
            python3 buildtools/ui/tests/test_boot_image.py --check-files \
              cube/swiss/swiss.dol cube/packer/swiss.dol cube/packer/reboot.dol
          fi
      - name: Package the SD card zip and the notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          buildtools/sd_package.sh "$TAG" cube/swiss/swiss.dol dist
          python3 buildtools/ci/check_package.py "dist/Indigo-$TAG.zip" \
            --dol cube/swiss/swiss.dol --version "$TAG"
          (cd dist && sha256sum "Indigo-$TAG.zip" > SHA256SUMS.txt)
          buildtools/release_notes.sh "$TAG" > dist/notes.md
          cat dist/SHA256SUMS.txt
          # The on-console updater's files, from the zip just checked:
          # Settings > Network reads these from a server or an SMB share.
          # A committed game content list is signed with the release.
          set --
          if [ -f buildtools/content/content.list ]; then
            set -- --content buildtools/content/content.list
          fi
          python3 buildtools/update_manifest.py "$TAG" "$COMMIT_SHA" \
            "$(git log -1 --format=%ct)" "$(git log -1 --format=%cs)" \
            "dist/Indigo-$TAG.zip" --out dist/update "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.meta.outputs.tag }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    environment: indigo-release-signing
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
    steps:
      - name: Require passing CI for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.build.outputs.sha }}
        run: |
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/check-runs?check_name=CI%20passed&per_page=100" \
              --jq '(.check_runs | sort_by(.id) | last) as $r | if $r == null then "missing" elif $r.status != "completed" then "pending:\($r.status)" else "done:\($r.conclusion)" end' 2>/dev/null) || state="pending:api-retry"
            if [ "$state" = "missing" ]; then
              # GitHub creates the "CI passed" check run only once its upstream jobs finish.
              wf=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT_SHA&per_page=20" \
                --jq '([.workflow_runs[] | select(.status != "completed")] | first) as $w | if $w != null then "pending:workflow-\($w.status)" else "missing" end' 2>/dev/null) || wf="pending:api-retry"
              state="$wf"
            fi
            case "$state" in
              done:success)
                echo "Verified passing 'CI passed' check run on $COMMIT_SHA."
                break
                ;;
              pending:*)
                echo "Waiting for 'CI passed' on $COMMIT_SHA ($state, attempt $attempt/90)..."
                sleep 30
                ;;
              *)
                echo "::error::Cannot publish release for $COMMIT_SHA: 'CI passed' state is '$state'."
                exit 1
                ;;
            esac
          done
          [ "$state" = "done:success" ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Indigo-*.zip
      - name: Sign the verified release manifest
        env:
          INDIGO_UPDATE_SIGNING_KEY: ${{ secrets.INDIGO_UPDATE_SIGNING_KEY }}
        run: python3 buildtools/sign_update.py dist/update/*.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TITLE: ${{ needs.build.outputs.title }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          shopt -s nullglob # dist/update/*.list: only with game content
          if [ "$PRERELEASE" = true ]; then set -- --prerelease --latest=false; else set -- --latest; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rerun may finish publishing an already created release. Check
            # the immutable download and signed files before advancing its feed.
            mkdir -p existing
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir existing
            for asset in "dist/Indigo-$TAG.zip" dist/SHA256SUMS.txt dist/update/*; do
              cmp "$asset" "existing/${asset##*/}"
            done
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TITLE" --notes-file dist/notes.md "$@" \
            "dist/Indigo-$TAG.zip" dist/SHA256SUMS.txt dist/provenance.json \
            "dist/update/indigo-$TAG.dol" "dist/update/apploader-$TAG.img" \
            dist/update/*.txt dist/update/*.signed dist/update/*.list
      - name: Retain signed update files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ needs.build.outputs.tag }}
          path: dist/update/
          if-no-files-found: error
          overwrite: true

  feed:
    name: Publish the console feed
    needs: [build, publish]
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: feed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ needs.build.outputs.tag }}
          path: signed
      - name: Publish the signed channel atomically
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C feed config user.name 'github-actions[bot]'
          git -C feed config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git -C feed fetch origin gh-pages
            git -C feed reset --hard FETCH_HEAD
            git -C feed clean -fd -- updates/
            python3 buildtools/publish_update.py "$TAG" signed feed/updates
            git -C feed add updates/
            git -C feed diff --cached --quiet && break
            git -C feed commit -s -m "Publish signed update for Indigo $TAG"
            git -C feed push origin HEAD:gh-pages && break
            [ "$attempt" -lt 3 ] || exit 1
          done
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
          buildtools/ci/verify_pages_feed.sh "$TAG" signed

  verify-published:
    name: Verify an existing console feed release
    if: github.event_name == 'workflow_dispatch' && inputs.verify_feed
    needs: build
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match the deployed feed to the published release assets
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir signed \
            --pattern '*.signed' --pattern '*.txt' --pattern '*.dol' --pattern '*.img'
          buildtools/ci/verify_pages_feed.sh "$TAG" signed
