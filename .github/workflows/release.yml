# A pushed tag becomes a GitHub Release: vX.Y.Z on main is a release (marked
# Latest), vX.Y.Z-beta.N and vX.Y.Z-rc.N on beta are pre-releases. The zip is built from the
# tagged commit on our own build runner (the pinned toolchain image), checked
# like every CI build, carries a build provenance attestation, and its notes
# are the tag's CHANGELOG section. workflow_dispatch builds an existing tag
# without publishing anything, to check the pipeline.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build as a dry run (nothing is published)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TOOLCHAIN: ghcr.io/extremscorner/libogc2@sha256:f9ffb7e33c4ba4010da8e40c01366f7c24732130146abd99690403bd42d3e4c2

jobs:
  build:
    name: Build the release zip
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Toolchain
        run: buildtools/ci/toolchain.sh "$TOOLCHAIN"
      - name: Check the tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            channel=main prerelease=false
          elif printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)\.[0-9]+'; then
            channel=beta prerelease=true
          else
            echo "not a release tag: $TAG (vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-rc.N)" >&2; exit 1
          fi
          # A release tag names a commit its branch already carries.
          git merge-base --is-ancestor HEAD "origin/$channel" || {
            echo "$TAG is not on $channel" >&2; exit 1; }
          title="Indigo $TAG"
          if [ "$prerelease" = false ]; then
            heading=$(awk -v v="$TAG" '/^## / && $2 == v { sub(/^## /, ""); print; exit }' CHANGELOG.md)
            [ -n "$heading" ] || { echo "CHANGELOG.md has no '## $TAG' section" >&2; exit 1; }
            title="Indigo $heading"
          fi
          {
            echo "tag=$TAG"
            echo "title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # The checked-out tag may predate the feature and this helper.
      # Report recorded card coverage without blocking an untested card.
      - name: Report MemCard PRO test coverage
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -f cube/swiss/source/gui/card_slots.c ]; then
            python3 buildtools/ci/check_memcard_qualification.py "$TAG" --report >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build Indigo
        run: make -j8 dev
      - name: Check the DOL
        run: |
          mkdir -p dist
          python3 buildtools/ci/verify_dol.py cube/swiss/swiss.dol --toolchain "$TOOLCHAIN" \
            --revision "$(git rev-parse HEAD)" --short "$(git rev-parse HEAD | cut -c1-7)" \
            --out dist/provenance.json
      - name: Build the bundled web browser
        env:
          # The Web face launches this; built from a pinned commit of our
          # hardened fork (used with permission; see NOTICE).
          CUBEBROWSER_REPO: https://github.com/spencernorton/cubebrowser
          CUBEBROWSER_REF: c98a0bfb5dbac270035542d2d5313c57725dace2
        run: |
          git clone --no-tags "$CUBEBROWSER_REPO" browser-src
          git -C browser-src -c advice.detachedHead=false checkout "$CUBEBROWSER_REF"
          (cd browser-src && ./get-mbedtls.sh && make -j8)
          mkdir -p browser/gcbrowser
          cp browser-src/cubebrowser.dol browser/cubebrowser.dol
          cp browser-src/sd/gcbrowser/cacert.pem browser/gcbrowser/cacert.pem
          # mbed TLS is built into the DOL: its licence ships beside it.
          cp browser-src/third_party/mbedtls/LICENSE browser/LICENSE-mbedtls.txt
          rm -rf browser-src
      - name: Package the SD card zip and the notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          buildtools/sd_package.sh "$TAG" cube/swiss/swiss.dol dist
          python3 buildtools/ci/check_package.py "dist/Indigo-$TAG.zip" \
            --dol cube/swiss/swiss.dol --version "$TAG"
          (cd dist && sha256sum "Indigo-$TAG.zip" > SHA256SUMS.txt)
          buildtools/release_notes.sh "$TAG" > dist/notes.md
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.meta.outputs.tag }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, indigo-build]
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Indigo-*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TITLE: ${{ needs.build.outputs.title }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then set -- --prerelease --latest=false; else set -- --latest; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TITLE" --notes-file dist/notes.md "$@" \
            "dist/Indigo-$TAG.zip" dist/SHA256SUMS.txt
